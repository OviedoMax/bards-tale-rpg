<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bard's Tale RPG Engine - City & Equipment Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #050505; color: #00ff66; font-family: monospace;
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
        }
        h2 { margin: 5px 0; font-size: 1.2rem; text-align: center; color: #00ff66; }
        
        #game-container {
            display: flex; flex-direction: column; align-items: center;
            border: 2px solid #00ff66; background: #000; padding: 10px; width: 100%; max-width: 480px;
            position: relative;
        }

        #viewport {
            width: 100%; height: auto; max-width: 320px;
            border: 2px solid #00ff66; background: #000; image-rendering: pixelated;
            touch-action: none;
        }

        #hud { width: 100%; margin-top: 8px; font-size: 0.85rem; }
        .hud-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .party-member { border-bottom: 1px dashed #005522; padding: 3px 0; }
        
        #log {
            width: 100%; height: 60px; border: 1px solid #00ff66; margin-top: 8px;
            padding: 5px; color: #ffff55; font-size: 0.8rem; overflow-y: auto; background: #050505;
        }

        #dpad-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
            width: 100%; max-width: 280px; margin-top: 10px;
        }
        .btn {
            background: #111; color: #00ff66; border: 1px solid #00ff66;
            padding: 10px 0; font-family: monospace; font-size: 0.9rem; font-weight: bold;
            text-align: center; border-radius: 4px; cursor: pointer;
        }
        .btn:active { background: #00ff66; color: #000; }
        .btn-magic { background: #110022; border-color: #bb66ff; color: #bb66ff; grid-column: span 3; }
        .btn-song { background: #002211; border-color: #00ff66; color: #00ff66; grid-column: span 3; }
        .btn-system { background: #112200; border-color: #aaff00; color: #aaff00; }

        .modal {
            display: none; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            background: rgba(5, 5, 5, 0.98); border: 2px solid #00ff66; padding: 12px;
            flex-direction: column; z-index: 100; color: #00ff66; font-size: 0.85rem; overflow-y: auto;
        }
        .modal select, .modal button {
            background: #002211; color: #00ff66; border: 1px solid #00ff66;
            padding: 8px; font-family: monospace; font-size: 0.85rem; margin-top: 6px; width: 100%;
            cursor: pointer;
        }
        .modal-purple { border-color: #bb66ff; color: #bb66ff; }
        .modal-purple select, .modal-purple button { background: #110022; color: #bb66ff; border-color: #bb66ff; }
    </style>
</head>
<body>

    <h2>SKARA BRAE CRAWLER</h2>

    <div id="game-container">
        <canvas id="viewport" width="320" height="240"></canvas>

        <div id="hud">
            <div class="hud-row">
                <span><strong>ZONE:</strong> <span id="zone-name">City Streets</span></span>
                <span><strong>POS:</strong> <span id="pos">(1,1)</span></span>
            </div>
            <div class="hud-row">
                <span><strong>GOLD:</strong> <span id="gold">100</span></span>
                <span><strong>SONG:</strong> <span id="song">OFF</span></span>
            </div>
            <hr style="border-color:#00ff66; margin: 4px 0;">
            <strong>PARTY ROSTER:</strong>
            <div id="party-list"></div>
        </div>

        <div id="log">Welcome to Skara Brae! Explore the city streets or enter a building.</div>

        <div id="dpad-container">
            <div></div>
            <div class="btn" onclick="handleMove(true)">▲ FW</div>
            <div></div>

            <div class="btn" onclick="handleTurn(false)">◄ L</div>
            <div class="btn" onclick="handleMove(false)">▼ BK</div>
            <div class="btn" onclick="handleTurn(true)">► R</div>

            <div class="btn btn-magic" onclick="openSpellMenu()">[C] CAST SPELL MENU</div>
            <div class="btn btn-song" onclick="handleSong()">[B] BARD SONG (+2 AC)</div>
            <div class="btn btn-system" onclick="handleSave()">[S] SAVE</div>
            <div></div>
            <div class="btn btn-system" onclick="handleLoad()">[L] LOAD</div>
        </div>

        <!-- Spell Modal -->
        <div id="spell-modal" class="modal modal-purple">
            <h3 style="margin: 0 0 8px 0; text-align: center; border-bottom: 1px solid #bb66ff; padding-bottom: 4px;">SPELLCASTING GRIMOIRE</h3>
            <label>1. Select Caster:</label>
            <select id="spell-caster" onchange="updateSpellOptions()"></select>
            <label style="margin-top: 8px; display:block;">2. Choose Incantation:</label>
            <select id="spell-select" onchange="updateTargetOptions()"></select>
            <label style="margin-top: 8px; display:block;">3. Target Selection:</label>
            <select id="spell-target"></select>
            <div style="display: flex; gap: 8px; margin-top: 15px;">
                <button onclick="executeCast()" style="background: #bb66ff; color: #000; font-weight: bold;">CAST</button>
                <button onclick="closeModal('spell-modal')" style="background: #330044; color: #ff6666; border-color: #ff6666;">CANCEL</button>
            </div>
        </div>

        <!-- City Location Modal -->
        <div id="city-modal" class="modal">
            <h3 id="city-title" style="margin: 0 0 8px 0; text-align: center; border-bottom: 1px solid #00ff66; padding-bottom: 4px;">LOCATION</h3>
            <div id="city-content"></div>
            <button onclick="closeCityLocation()" style="margin-top: 15px; background: #220000; color: #ff6666; border-color: #ff6666;">LEAVE LOCATION</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="audio.js"></script>
    <script src="engine.js"></script>
    <script src="renderer.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
